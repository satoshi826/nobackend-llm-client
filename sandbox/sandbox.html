<!doctype html>
<!--
  The sandbox: shows HTML and runs JavaScript that a model or a file supplies. The app opens it in
  <iframe sandbox="allow-scripts allow-forms">, so it has no origin of its own: it cannot reach the app's storage, the
  key vault or the page around it. Its CSP (put in by the build, and sent as a header too) blocks every request, forms
  included, and the app's own frame-src keeps it from navigating to another site.
  Talking to the app: this page says { type: 'sandbox-ready' } to its parent once; the parent answers with
  { type: 'connect' } and a MessagePort, and everything after goes over that port, which the HTML shown here cannot
  reach (so a page that replaced this one cannot talk to the app):
    { type: 'render', html, path?, files?, storage?, api? }
                                           replace this page with the html (its scripts run under the same CSP; in the
                                           mode its doctype asks for, standards without one: pageToWrite); with
                                           files ({ path: text or Blob } of its site) and path (the page's own), its
                                           references to those files use them (sandbox/rewrite.js); with storage
                                           ({ key: value }) its localStorage starts with those items, and its changes
                                           go back as { type: 'storage', items }, at most every 0.5 s; with api
                                           (experimental: names of calls the app answers) the page gets them, see
                                           installApi
    { type: 'call', id, name, args }       (sent) a call of the shown page's api, answered with
                                           { type: 'callResult', id, value?, error? }
    { type: 'storage', items }             (sent) the shown page's localStorage after it changed
    { type: 'log', entries }               (sent) the shown page's console output and errors, as { level, text }
                                           ('log', 'info', 'warn', 'error', 'debug'; 'exception' for an error not
                                           caught or a rejection; 'resource' for a file that did not load; 'csp' for
                                           what the sandbox blocked), file names in place of blob: URLs, at most 500
    { type: 'eval', id, code }             run code on the shown page as the body of an async function and answer
                                           { type: 'evalResult', id, result?, error? } (preview_page: a model trying
                                           its page)
    { type: 'run', id, code, files?, dom?, timeoutMs }
                                           run code and answer { type: 'result', id, logs, result?, error? }: in a worker
                                           (stopped after timeoutMs), or with dom on this page itself, where DOMParser
                                           exists (the app removes the frame if it does not answer in time); files is
                                           { name: text } for the code to read as \`files\`
    { type: 'ping', n }                    answered with { type: 'pong', n } while this page is not stuck
  A page without an origin has no localStorage or sessionStorage of its own: sandbox/storage.js stands in for both
  (in memory; a shown page's localStorage is kept by the app when the render gives storage).
  The script is inline: a page without an origin cannot load module scripts from the server. The build puts
  sandbox/rewrite.js and sandbox/storage.js into it at REWRITE and STORAGE (vite.config.ts), inside its function, so
  the shown page finds no names of ours.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <!--CSP-->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      (() => {
        'use strict';
        // Act only as a sandbox: without the sandbox attribute this page would run with the app's origin, and a site
        // embedding it could have it read the app's storage. So it does nothing unless it has no origin of its own
        if (self.origin !== 'null') {
          document.body.textContent = 'This page only works inside the app.';
          return;
        }
        /*REWRITE*/
        /*STORAGE*/
        // Code run on this page (dom) gets storage in memory too, rather than an error
        installStorage(makeStorage(), makeStorage());
        // Runs code as the body of an async function and collects its console output: on this page (dom), and from
        // its source in each worker
        async function runCode(code, files) {
          const logs = [];
          const show = (v) => {
            try {
              return typeof v === 'string' ? v : (JSON.stringify(v, null, 2) ?? String(v));
            } catch {
              return String(v);
            }
          };
          const saved = {};
          for (const level of ['log', 'info', 'warn', 'error', 'debug']) {
            saved[level] = console[level];
            console[level] = (...args) => {
              logs.push((level === 'log' || level === 'info' ? '' : level + ': ') + args.map(show).join(' '));
              if (logs.length > 1000) logs.shift();
            };
          }
          try {
            const value = await new Function('files', 'return (async () => {\n' + code + '\n})()')(files);
            return { logs, result: value === undefined ? undefined : show(value) };
          } catch (err) {
            return { logs, error: String((err && err.stack) || err) };
          } finally {
            Object.assign(console, saved);
          }
        }
        const WORKER = `const runCode = ${runCode};\nonmessage = async (e) => postMessage(await runCode(e.data.code, e.data.files));`;
        let port = null;

        // ---- experimental: the shown page's api (only when the app gives one: a page the user shows, in a build
        // with VITE_EXPERIMENTAL_PAGE_API). Every call goes to the app over the port; nothing here reaches the network
        const calls = new Map();
        let lastCall = 0;
        function call(name, args) {
          return new Promise((resolve, reject) => {
            const id = ++lastCall;
            calls.set(id, { resolve, reject });
            port.postMessage({ type: 'call', id, name, args });
          });
        }
        function onCallResult(d) {
          const c = calls.get(d.id);
          if (!c) return;
          calls.delete(d.id);
          if (typeof d.error === 'string') c.reject(new Error(d.error));
          else c.resolve(d.value);
        }
        const plainFetch = window.fetch;
        /** https addresses fetched from the image elements, by address: their blob: URLs */
        const proxied = new Map();
        // nbl.files.list() / read(path) / write(path, text): the files of the page's site; nbl.chat(prompt, { system })
        // the text of a model's answer; with fetch, fetch(url) of an https address (GET only) through the fetch page,
        // and images from https addresses fetched the same way
        function installApi(names) {
          const has = (n) => names.includes(n);
          const nbl = {};
          if (has('files.list'))
            nbl.files = Object.freeze({
              list: () => call('files.list', {}),
              read: (path) => call('files.read', { path: String(path) }),
              write: (path, text) => call('files.write', { path: String(path), text: String(text) })
            });
          if (has('chat')) nbl.chat = (prompt, o) => call('chat', { prompt: String(prompt), system: o && o.system != null ? String(o.system) : undefined });
          if (has('fetch')) {
            nbl.fetch = async (input, init) => {
              const url = typeof input === 'string' ? input : input instanceof URL ? input.href : input && input.url;
              const method = ((init && init.method) || (input && typeof input === 'object' && input.method) || 'GET').toUpperCase();
              if (method !== 'GET') throw new TypeError('Only GET requests can be made from the sandbox.');
              if (!/^https:/i.test(String(url))) throw new TypeError('Only https addresses can be fetched from the sandbox: ' + url);
              const r = await call('fetch', { url: String(url) });
              const res = new Response(r.data, { status: 200, headers: { 'content-type': r.mime } });
              Object.defineProperty(res, 'url', { value: r.url });
              return res;
            };
            // Everything else (relative addresses) goes to the browser's own fetch, where the CSP blocks it
            window.fetch = (input, init) => {
              const url = typeof input === 'string' ? input : input instanceof URL ? input.href : input && input.url;
              return /^https:/i.test(String(url)) ? nbl.fetch(input, init) : plainFetch.call(window, input, init);
            };
          }
          window.nbl = Object.freeze(nbl);
        }
        /** An image element's https address becomes a blob: URL of what the fetch page got (asked once per address) */
        function proxyImage(img) {
          const src = img.getAttribute('src');
          if (img.hasAttribute('srcset') && /https:/i.test(img.getAttribute('srcset'))) img.removeAttribute('srcset');
          if (!src || !/^https:/i.test(src)) return;
          if (!proxied.has(src))
            proxied.set(
              src,
              call('fetch', { url: src }).then(
                (r) => URL.createObjectURL(new Blob([r.data], { type: r.mime })),
                (err) => {
                  console.warn('Image did not load: ' + src + ' (' + err.message + ')');
                  return null;
                }
              )
            );
          img.dataset.nblSrc = src;
          proxied.get(src).then((u) => u && img.getAttribute('src') === src && img.setAttribute('src', u));
        }
        function watchImages() {
          new MutationObserver((records) => {
            for (const r of records) {
              if (r.type === 'attributes') {
                if (r.target.tagName === 'IMG') proxyImage(r.target);
                continue;
              }
              for (const n of r.addedNodes) {
                if (n.nodeType !== 1) continue;
                if (n.tagName === 'IMG') proxyImage(n);
                for (const img of n.querySelectorAll('img')) proxyImage(img);
              }
            }
          }).observe(document, { subtree: true, childList: true, attributes: true, attributeFilter: ['src', 'srcset'] });
        }

        function run(d) {
          const url = URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }));
          const worker = new Worker(url);
          URL.revokeObjectURL(url);
          let done = false;
          const finish = (m) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            worker.terminate();
            port.postMessage({ ...m, type: 'result', id: d.id });
          };
          const timer = setTimeout(() => finish({ logs: [], error: 'Stopped: it ran longer than ' + d.timeoutMs + ' ms.' }), d.timeoutMs);
          worker.onmessage = (m) => finish(m.data);
          worker.onerror = (ev) => {
            ev.preventDefault();
            finish({ logs: [], error: String(ev.message || 'Error') });
          };
          worker.postMessage({ code: d.code, files: d.files });
        }

        // With dom: on this page, so the code has DOMParser (e.g. to try a scraper on a saved HTML file)
        async function runHere(d) {
          noPeers();
          port.postMessage({ ...(await runCode(d.code, d.files)), type: 'result', id: d.id });
        }

        // A peer connection could carry data out past the CSP in browsers that do not enforce its webrtc directive
        // (Chrome among them): not offered to code on this page. A frame the code makes has its own, so this only
        // raises the bar
        function noPeers() {
          for (const k of ['RTCPeerConnection', 'webkitRTCPeerConnection', 'RTCDataChannel']) {
            try {
              delete window[k];
            } catch {}
          }
        }

        // The shown page's localStorage goes back to the app, at most every 0.5 s (the newest items when it goes), and at
        // once when the page goes away (the frame removed, shown again), so its last change is not lost
        let storageItems = null;
        let storageTimer = 0;
        function sendStorage() {
          clearTimeout(storageTimer);
          storageTimer = 0;
          if (storageItems) port.postMessage({ type: 'storage', items: storageItems });
          storageItems = null;
        }
        function keepStorage(items) {
          storageItems = items;
          storageTimer ||= setTimeout(sendStorage, 500);
        }

        const showValue = (v) => {
          try {
            return typeof v === 'string' ? v : (JSON.stringify(v) ?? String(v));
          } catch {
            return String(v);
          }
        };
        // The console as this page found it: each shown page's console is wrapped anew around these
        const plainConsole = {};
        for (const level of ['log', 'info', 'warn', 'error', 'debug']) plainConsole[level] = console[level];

        // What the shown page logs, what goes wrong in it, and what the sandbox blocks, back to the app. Called between
        // document.open() (which drops every listener of the window and the document) and the page's own scripts
        function watchPage(names) {
          const pending = [];
          let sent = 0;
          let timer = 0;
          const seen = new Set();
          // A reference to no file of the site resolves against this page's own address: shown as the reference
          const base = location.href.replace(/[^/]*$/, '');
          const named = (text) =>
            String(text)
              .replace(/blob:null\/[\w-]+/g, (u) => names.get(u) || u)
              .split(base)
              .join('')
              .slice(0, 1000);
          const note = (level, text) => {
            text = named(text);
            // A file that did not load, or a block, is told once (both copies of the CSP report it; a blocked file errors
            // too); what the page logs is told every time
            if (sent >= 500) return;
            if (level === 'resource' || level === 'csp') {
              if (seen.has(level + text)) return;
              seen.add(level + text);
            }
            sent++;
            pending.push({ level, text });
            timer ||= setTimeout(() => {
              timer = 0;
              port.postMessage({ type: 'log', entries: pending.splice(0) });
            }, 200);
          };
          for (const level of Object.keys(plainConsole)) {
            console[level] = (...args) => {
              note(level, args.map(showValue).join(' '));
              plainConsole[level].apply(console, args);
            };
          }
          addEventListener(
            'error',
            (e) => {
              const el = e.target;
              // An image fetched through the app (proxyImage) tells its own failure
              if (el && el.dataset && el.dataset.nblSrc) return;
              if (el && el !== window && el.nodeType === 1) notLoaded(el.getAttribute('src') || el.getAttribute('href') || el.tagName.toLowerCase());
              else note('exception', (e.message || 'Error') + (e.filename ? ' (' + (e.filename === location.href ? 'inline script' : e.filename) + ', line ' + e.lineno + ')' : ''));
            },
            true
          );
          addEventListener('unhandledrejection', (e) => note('exception', 'Unhandled rejection: ' + showValue(e.reason && e.reason.stack ? e.reason.stack : e.reason)));
          // A file the page asked for and did not get, with why: from the network, or not a file of its site
          const notLoaded = (raw) => {
            // An image fetched through the app instead: told only if that fails
            if (proxied.has(raw)) return;
            const ref = named(raw);
            note('resource', 'Did not load: ' + ref + (/^(https?:)?\/\//i.test(ref) ? ' (the sandbox has no network)' : /^(data|blob):/i.test(ref) ? '' : ' (no such file in the site)'));
          };
          addEventListener('pagehide', sendStorage);
          // What the CSP blocks: a file (a script, a stylesheet's image or font) is told as one that did not load
          document.addEventListener('securitypolicyviolation', (e) => {
            if (/^(script|style|img|media|font)-src/.test(e.effectiveDirective) && /^(https?|blob|data):/i.test(e.blockedURI)) notLoaded(e.blockedURI);
            else note('csp', 'Blocked by the sandbox: ' + e.effectiveDirective + (e.blockedURI ? ' ' + e.blockedURI : ''));
          });
        }

        async function evalHere(d) {
          try {
            const value = await new Function('return (async () => {\n' + d.code + '\n})()')();
            port.postMessage({ type: 'evalResult', id: d.id, result: value === undefined ? undefined : showValue(value) });
          } catch (err) {
            port.postMessage({ type: 'evalResult', id: d.id, error: String((err && err.stack) || err) });
          }
        }

        function onPortMessage(e) {
          const d = e.data || {};
          if (d.type === 'ping') port.postMessage({ type: 'pong', n: d.n });
          else if (d.type === 'callResult') onCallResult(d);
          else if (d.type === 'run' && typeof d.code === 'string') {
            const files = d.files && typeof d.files === 'object' ? d.files : {};
            if (d.dom) void runHere({ id: d.id, code: d.code, files });
            else run({ id: d.id, code: d.code, files, timeoutMs: d.timeoutMs });
          } else if (d.type === 'eval' && typeof d.code === 'string') void evalHere(d);
          else if (d.type === 'render' && typeof d.html === 'string') {
            noPeers();
            const names = new Map();
            const page = pageToWrite(d.html);
            const html = d.files && typeof d.files === 'object' && typeof d.path === 'string' ? rewritePage(page, d.path, d.files, names) : page;
            const kept = d.storage && typeof d.storage === 'object' ? d.storage : null;
            installStorage(makeStorage(kept, kept && keepStorage), makeStorage());
            const api = Array.isArray(d.api) ? d.api.filter((n) => typeof n === 'string') : [];
            if (api.length) installApi(api);
            document.open();
            watchPage(names);
            if (api.includes('fetch')) watchImages();
            document.write(html);
            document.close();
          }
        }

        // The one message taken from the window: the parent's port. Only once, only from the parent
        function onConnect(e) {
          if (e.source !== parent || port || (e.data || {}).type !== 'connect' || !e.ports[0]) return;
          port = e.ports[0];
          port.onmessage = onPortMessage;
          removeEventListener('message', onConnect);
        }
        addEventListener('message', onConnect);
        parent.postMessage({ type: 'sandbox-ready' }, '*');
      })();
    </script>
  </body>
</html>
